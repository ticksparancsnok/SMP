# Any name that isn't SMP's own: the DNS sinkhole points blocked sites at this
# server, so show the block page (the Go service looks the name up in the blocklist).
location / {
    proxy_pass http://smp_blockpage;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 /smp-unknown-host.html;  # not blocked: someone used an address SMP doesn't know
}
location = /smp-unknown-host.html {
    internal;
    root /usr/share/nginx/smp;
}
