name: CLA Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  check-cla:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Verify CLA signature status
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const authorId = pr.user.id;
            const headSha = pr.head.sha;

            // Add your 2 existing contributors here AFTER their DÁP PDFs are signed
            const EXEMPT_USERS = [
              owner,
              'dependabot[bot]',
              'github-actions[bot]'
            ];

            if (EXEMPT_USERS.includes(author)) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha,
                state: 'success',
                context: 'cla/signed',
                description: 'Maintainer or pre-cleared contributor'
              });
              return;
            }

            let signed = false;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo,
                path: 'signatures.json',
                ref: 'cla-signatures'
              });
              const list = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              signed = list.some(entry => entry.id === authorId);
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (signed) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha,
                state: 'success',
                context: 'cla/signed',
                description: 'CLA v1.0 signed and on file'
              });
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: headSha,
              state: 'failure',
              context: 'cla/signed',
              description: 'Contributor must accept CLA.md in PR comments'
            });

            const marker = '<!-- gg4ever-cla-prompt -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number
            });

            if (!comments.some(c => c.body && c.body.includes(marker))) {
              const claUrl = `https://github.com/${owner}/${repo}/blob/${pr.base.ref}/CLA.md`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  marker,
                  `Hi @${author}! Thank you for your pull request.`,
                  '',
                  `Before we can merge your code, please review our [Contributor License Agreement (CLA.md)](${claUrl}) and sign it once by posting a new comment with the exact line below:`,
                  '',
                  '```text',
                  'I have read the CLA Document and I hereby sign the CLA',
                  '```'
                ].join('\n')
              });
            }

  record-signature:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Record CLA signature and unlock PR
        uses: actions/github-script@v8
        with:
          script: |
            const PHRASE = 'I have read the CLA Document and I hereby sign the CLA';
            if (context.payload.comment.body.trim() !== PHRASE) return;

            const { owner, repo } = context.repo;
            const prNumber = context.payload.issue.number;
            const signer = context.payload.comment.user;

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber
            });

            if (signer.id !== pr.user.id) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `@${signer.login} Only the pull request author (@${pr.user.login}) can clear the CLA check for this PR.`
              });
              return;
            }

            const newEntry = {
              id: signer.id,
              login: signer.login,
              cla_version: '1.0',
              signed_at: new Date().toISOString(),
              pr_number: prNumber,
              comment_url: context.payload.comment.html_url
            };

            let list = [];
            let fileSha = null;
            let branchExists = true;

            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo,
                path: 'signatures.json',
                ref: 'cla-signatures'
              });
              list = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              fileSha = data.sha;
            } catch (err) {
              if (err.status === 404) {
                branchExists = false;
              } else {
                throw err;
              }
            }

            if (!branchExists) {
              const contentStr = JSON.stringify([newEntry], null, 2) + '\n';
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content: contentStr, encoding: 'utf-8'
              });
              const { data: tree } = await github.rest.git.createTree({
                owner, repo,
                tree: [{ path: 'signatures.json', mode: '100644', type: 'blob', sha: blob.sha }]
              });
              const { data: commit } = await github.rest.git.createCommit({
                owner, repo,
                message: `chore(cla): record CLA signature for @${signer.login}`,
                tree: tree.sha,
                parents: []
              });
              await github.rest.git.createRef({
                owner, repo,
                ref: 'refs/heads/cla-signatures',
                sha: commit.sha
              });
            } else if (!list.some(entry => entry.id === signer.id)) {
              list.push(newEntry);
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'signatures.json',
                message: `chore(cla): record CLA signature for @${signer.login}`,
                content: Buffer.from(JSON.stringify(list, null, 2) + '\n').toString('base64'),
                sha: fileSha,
                branch: 'cla-signatures'
              });
            }

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha,
              state: 'success',
              context: 'cla/signed',
              description: 'CLA v1.0 signed and recorded'
            });

            await github.rest.reactions.createForIssueComment({
              owner, repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });