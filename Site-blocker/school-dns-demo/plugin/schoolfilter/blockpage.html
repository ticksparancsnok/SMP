<!-- Hungarian block page; blockpage.en.html is the same in English (keep them in step). -->
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webhely blokkolva</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef3f8; color: #172033; }
    main { position: relative; width: min(92vw, 620px); padding: 3.25rem 2.5rem 2.5rem; border-radius: 18px; background: white; box-shadow: 0 12px 40px #17203320; box-sizing: border-box; }
    h1 { margin-top: 0; color: #b42318; }
    dt { font-weight: 700; margin-top: 1rem; }
    dd { margin: .25rem 0 0; overflow-wrap: anywhere; }
    nav { position: absolute; top: 1rem; right: 1rem; display: flex; border: 1px solid #d5dde6; border-radius: 8px; overflow: hidden; font-size: .8rem; }
    nav a { padding: .25rem .6rem; color: #52607a; text-decoration: none; }
    nav a[aria-current] { background: #172033; color: white; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Nyelv / Language">
      <a href="?lang=hu" hreflang="hu" aria-current="true">HU</a>
      <a href="?lang=en" hreflang="en" lang="en">EN</a>
    </nav>
    <h1>Ez a webhely blokkolva van</h1>
    <p>Az iskolai hálózat szabályzata alapján a kért oldal nem érhető el.</p>
    <dl>
      <dt>Kért domain</dt><dd>{{.Domain}}</dd>
      <dt>Indok</dt><dd>{{if .Reason}}{{.Reason}}{{else}}Az iskolai tartalomszűrő szabályzata{{end}}</dd>
      <dt>Hozzáadta</dt><dd>{{.AddedBy}}</dd>
      {{with .Confidence}}<dt>AI-bizonyosság</dt><dd>{{printf "%.2f" .}}</dd>{{end}}
    </dl>
  </main>
</body>
</html>
