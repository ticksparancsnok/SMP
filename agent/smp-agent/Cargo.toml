[package]
name = "smp-agent"
description = "SMP device agent: joins the SMP server, reports state, runs capabilities (screen monitoring, ...)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"                                   # error handling with context
clap = { version = "4", features = ["derive"] }  # command line (join / run / status)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"                            # RUST_LOG=debug for details
# HTTPS: a small blocking client (threads, no async runtime) on rustls with the "ring"
# crypto backend, which cross-compiles to Windows without a C toolchain.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"                    # the OS's trusted CAs (Windows certificate store)
# Device identity: ECDSA P-256 (TPM-compatible), SHA-256 fingerprints.
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
httpdate = "1"                                 # server clock from the Date header
gethostname = "0.5"
mac_address = "1"
# Screen pictures: pure-Rust JPEG encoder (shrinking is our own code, capabilities/screen/encode.rs)
jpeg-encoder = "0.7"
# The school's logo on the lock screen (SMP stores it as PNG): pure-Rust decoder
png = "0.18"

[dev-dependencies]
tempfile = "3"

# Windows only: the service, the session helper (screen capture + tray icon), DPAPI.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"                       # register with / run under the Service Control Manager
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_ApplicationInstallationAndServicing", # Windows Installer (software: .msi product codes)
    "Win32_Globalization",                    # system UI language (tray tooltip HU/EN)
    "Win32_Graphics_Gdi",                     # screen capture (BitBlt)
    "Win32_Security",                         # tokens, file ACLs
    "Win32_Security_Authorization",           # ACLs written as SDDL strings
    "Win32_Security_Cryptography",            # DPAPI (key wrapping)
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",               # %ProgramFiles% etc. in software rules
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",                     # service <-> session helper
    "Win32_System_Registry",                  # Windows version
    "Win32_System_RemoteDesktop",             # sessions, logged-in user (WTS)
    "Win32_System_SystemInformation",         # boot time (software: restart pending?)
    "Win32_System_Threading",                 # start the helper in the user's session
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",        # remote control: SendInput
    "Win32_UI_Shell",                         # tray icon
    "Win32_UI_WindowsAndMessaging",           # windows, tray, screen lock (window + input hooks)
] }
