# SMP device agent (Rust). See README.md for the layout and how to build.
[workspace]
members = ["smp-agent"]
resolver = "2"

[workspace.package]
# No version here: it comes from [agent] in ../Version.toml (smp-agent/build.rs).
edition = "2021"
license = "AGPL-3.0-or-later"   # see LICENSE and NOTICE in the repository root
repository = "https://github.com/ticksparancsnok/SMP"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
